services:
  vigia-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vigia_api
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - vigia_uploads:/app/uploads
    networks:
      - vigia_net

  caddy:
    image: caddy:alpine
    container_name: vigia_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vigia-api
    networks:
      - vigia_net

volumes:
  vigia_uploads:
  caddy_data:
  caddy_config:

networks:
  vigia_net:
    driver: bridge
